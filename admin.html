<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yönetim Paneli (Demo) · Premium Cinema</title><meta name="robots" content="noindex"><meta name="theme-color" content="#08090D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E50924'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%23fff'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{display:block}.adm{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.adm-side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:calc(var(--safe-t) + 20px) 14px 20px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;z-index:80}
.adm-side .logo{padding:6px 10px 14px}.demo-pill{margin:0 10px 12px;padding:6px 10px;border-radius:10px;background:rgba(245,184,61,.12);border:1px solid rgba(245,184,61,.4);color:#f5c76a;font-size:.74rem;font-weight:600}
.adm-nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#c4c7d4;background:none;border:0;text-align:left;width:100%;font-weight:500;font-size:.93rem}.adm-nav:hover{background:rgba(255,255,255,.06);color:#fff}.adm-nav.on{background:rgba(var(--accent-rgb),.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.4)}.adm-nav svg{width:18px;height:18px}
.adm-main{min-width:0;padding:calc(var(--safe-t) + 18px) clamp(16px,3vw,40px) 60px}
.adm-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.adm-top h1{font-size:clamp(1.4rem,3vw,2rem)}.adm-top .grow{flex:1}.menu-btn{display:none}
.demo-note{padding:12px 16px;border-radius:14px;background:rgba(245,184,61,.08);border:1px solid rgba(245,184,61,.3);color:#e9cf93;font-size:.88rem;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}.stat{padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}.stat small{color:var(--muted);display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}.stat b{display:block;font:800 clamp(1.5rem,3vw,2.1rem) var(--font);margin-top:6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.panel{padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-width:0}.panel h2{font-size:1.05rem;margin-bottom:14px}
.mini{display:grid;gap:8px}.mini-i{display:flex;align-items:center;gap:12px;padding:6px;border-radius:12px}.mini-i img{width:38px;height:56px;border-radius:8px;object-fit:cover;background:var(--bg2)}.mini-i b{display:block;font-size:.92rem}.mini-i small{color:var(--muted)}
.act{display:grid;gap:10px;max-height:340px;overflow:auto}.act div{display:flex;gap:10px;font-size:.88rem;color:#cfd2de}.act small{color:var(--muted);white-space:nowrap;margin-left:auto}.act i{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px}.bars i{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent),rgba(var(--accent-rgb),.25));min-height:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}.toolbar input,.toolbar select{min-height:42px;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line2)}.toolbar input[type=search]{flex:1;min-width:180px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.9rem}th{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(255,255,255,.03)}
.th{width:40px;height:58px;border-radius:8px;object-fit:cover;background:var(--bg2)}.th-w{width:84px;height:48px}.cell-t b{display:block}.cell-t small{color:var(--muted)}.url{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.row-a{display:flex;gap:6px;justify-content:flex-end}.mbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);display:grid;place-items:center}.mbtn:hover{background:var(--accent);border-color:var(--accent)}.mbtn svg{width:16px;height:16px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.75rem;font-weight:600}.tag.ok{background:rgba(70,211,127,.15);color:var(--ok)}.tag.off{background:rgba(255,107,125,.15);color:#ff8d9b}
.switch{position:relative;width:42px;height:24px;display:inline-block}.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;border-radius:12px;background:#3a3c4a;transition:.2s;cursor:pointer}.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+span{background:var(--accent)}.switch input:checked+span::after{transform:translateX(18px)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gen{display:flex;flex-wrap:wrap;gap:6px}.gen label{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:.84rem;cursor:pointer}.gen label{position:relative}.gen input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}.gen label:focus-within{outline:2px solid var(--accent)}.gen label:has(input:checked){background:rgba(var(--accent-rgb),.2);border-color:var(--accent)}
.imgf{display:grid;gap:8px}.imgf .pv{border-radius:12px;background:var(--bg2);border:1px dashed var(--line2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem}.imgf .pv.p{aspect-ratio:2/3;max-width:140px}.imgf .pv.b{aspect-ratio:16/9}.imgf .pv img{width:100%;height:100%;object-fit:cover}
.modal-box{width:min(720px,100%)}.modal-box h2{padding-right:40px}.f small{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){.adm{grid-template-columns:1fr}.adm-side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .3s var(--ease);box-shadow:var(--shadow)}body.nav-open .adm-side{transform:none}.menu-btn{display:grid}.grid2{grid-template-columns:1fr}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none}body.nav-open .scrim{display:block}}
</style>
</head>
<body data-admin>
<div class="scrim" id="scrim"></div>
<div class="adm">
  <aside class="adm-side" id="side" aria-label="Admin menu"></aside>
  <div class="adm-main"><div class="adm-top"><button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="title"></h1><span class="grow"></span><a class="btn btn-glass btn-sm" href="index.html">← Siteye dön</a></div>
    <div class="demo-note" id="note"></div><main id="adm-view"></main></div>
</div>
<div id="modalRoot"></div><div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
<script>
'use strict';
const L = (tr, en) => S.lang === 'en' ? en : tr;
const IC = { ...ICON, users: sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.2-5 6.5-5s5.7 1.4 6.5 5M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 15.2c1.7.6 2.7 2 3 4.8"/>'), chat: sv('<path d="M4 5h16v11H9l-5 4z"/>'), key: sv('<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l3 3"/>'), edit: sv('<path d="M4 20h4L19 9l-4-4L4 16z"/>'), tag: sv('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2" fill="currentColor"/>'), dash: sv('<rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/>') };
const SECTIONS = [['overview', L('Genel Bakış', 'Overview'), IC.dash], ['movies', L('Filmler', 'Movies'), IC.film], ['series', L('Diziler', 'TV Series'), IC.tv], ['episodes', L('Bölümler', 'Episodes'), IC.list], ['sources', L('Video Kaynakları', 'Video Sources'), IC.play], ['categories', L('Kategoriler', 'Categories'), IC.tag], ['users', L('Kullanıcılar (demo)', 'Users (demo)'), IC.users], ['comments', L('Yorumlar (demo)', 'Comments (demo)'), IC.chat], ['settings', L('Ayarlar', 'Settings'), IC.gear], ['api', L('API Yapılandırması', 'API Configuration'), IC.key]];
let cat = catalog(), cur = 'overview', epSeries = '', epSeason = 1;
const $v = () => $('#adm-view');
const commit = msg => { if (!saveCatalog(cat)) { toast(L('Tarayıcı depolaması dolu — daha küçük görseller kullanın.', 'Browser storage is full — use smaller images.')); return false; } if (msg) logActivity(msg); return true; };
const ago = ts => { const m = Math.round((Date.now() - ts) / 6e4); return m < 1 ? L('şimdi', 'now') : m < 60 ? m + L(' dk', ' min') : m < 1440 ? Math.round(m / 60) + L(' sa', ' h') : Math.round(m / 1440) + L(' gün', ' d'); };
const gl = () => GENRE_FB[S.lang];
const norm = it => normLocal(it);
const poster = it => it.poster || art(it.title, 'poster');

function shell() {
  $('#side').innerHTML = `<a class="logo" href="index.html">${LOGO_SVG}<span>PREMIUM<b>CINEMA</b></span></a><div class="demo-pill">${L('Yalnızca ön yüz demosu · veriler bu tarayıcıda (LocalStorage)', 'Frontend demo only · data lives in this browser (LocalStorage)')}</div>` + SECTIONS.map(([k, l, i]) => `<button class="adm-nav" type="button" data-s="${k}">${i}${esc(l)}</button>`).join('');
  $('#note').textContent = L('⚠ Bu yönetim paneli bir ön yüz (frontend) demosudur. Sunucu, veritabanı veya gerçek kimlik doğrulama yoktur; herkes bu sayfayı açabilir ve veriler yalnızca bu tarayıcıda saklanır.', '⚠ This admin dashboard is a frontend demo. There is no server, database or real authentication; anyone can open it and data is stored only in this browser.');
}
const LOGO_SVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M12 9.5v13l11-6.5z" fill="#fff"/></svg>';
function go(s) { cur = SECTIONS.some(x => x[0] === s) ? s : 'overview'; if (location.hash !== '#' + cur) history.replaceState(null, '', '#' + cur); document.body.classList.remove('nav-open'); $$('.adm-nav').forEach(b => b.classList.toggle('on', b.dataset.s === cur)); $('#title').textContent = SECTIONS.find(x => x[0] === cur)[1]; document.title = $('#title').textContent + ' · Admin (demo)'; ({ overview, movies: () => content('movie'), series: () => content('tv'), episodes, sources, categories, users, comments, settings, api })[cur](); }

/* ---------- overview ---------- */
function overview() {
  const mv = cat.filter(x => x.type === 'movie'), tv = cat.filter(x => x.type === 'tv'), eps = tv.reduce((n, x) => n + (x.seasons || []).reduce((m, s) => m + s.episodes.length, 0), 0), views = cat.reduce((n, x) => n + (x.views || 0), 0), srcN = Object.values(LS.get(K.sources, {})).reduce((n, a) => n + a.length, 0);
  const recent = [...cat].sort((a, b) => (b.added || 0) - (a.added || 0)).slice(0, 5), pop = [...cat].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 5), act = LS.get(K.activity, []);
  const days = Array.from({ length: 14 }, (_, i) => 30 + (hash('d' + i) % 70)), mx = Math.max(...days);
  const mini = x => `<div class="mini-i"><img src="${esc(poster(x))}" alt="" loading="lazy"><div><b>${esc(x.title)}</b><small>${x.type === 'tv' ? L('Dizi', 'Series') : L('Film', 'Movie')} · ${esc(x.year || '')} · ★ ${Number(x.rating || 0).toFixed(1)}</small></div></div>`;
  $v().innerHTML = `<div class="stats">${[[L('Toplam Film', 'Total movies'), mv.length], [L('Toplam Dizi', 'Total series'), tv.length], [L('Toplam Bölüm', 'Total episodes'), eps], [L('Görüntülenme (demo)', 'Views (demo)'), views.toLocaleString()], [L('Video kaynağı', 'Video sources'), srcN]].map(([l, n]) => `<div class="stat"><small>${l}</small><b>${n}</b></div>`).join('')}</div>
  <div class="cols"><section class="panel"><h2>${L('Son eklenenler', 'Recently added')}</h2><div class="mini">${recent.map(mini).join('')}</div></section><section class="panel"><h2>${L('En popüler', 'Most popular')}</h2><div class="mini">${pop.map(mini).join('')}</div></section>
  <section class="panel"><h2>${L('Görüntülenme (son 14 gün, demo)', 'Views (last 14 days, demo)')}</h2><div class="bars" role="img" aria-label="chart">${days.map(d => `<i style="height:${d / mx * 100}%" title="${d}"></i>`).join('')}</div></section>
  <section class="panel"><h2>${L('Etkinlik akışı', 'Activity feed')}</h2><div class="act">${act.length ? act.map(a => `<div><i></i><span>${esc(a.text)}</span><small>${ago(a.ts)}</small></div>`).join('') : `<p class="muted">${L('Henüz etkinlik yok. Bir içerik ekleyin veya düzenleyin.', 'No activity yet. Add or edit something.')}</p>`}</div></section></div>`;
}

/* ---------- movies / series ---------- */
const filt = { q: '', g: '', ql: '', sort: 'added' };
function content(type) {
  const isTv = type === 'tv', G = gl();
  $v().innerHTML = `<div class="toolbar"><input type="search" id="fq" placeholder="${L('Ara…', 'Search…')}" value="${esc(filt.q)}"><select id="fg"><option value="">${L('Tüm kategoriler', 'All categories')}</option>${Object.entries(G).map(([id, n]) => `<option value="${id}" ${filt.g == id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select><select id="fql"><option value="">${L('Tüm kaliteler', 'All qualities')}</option>${['SD', 'HD', '4K'].map(q => `<option ${filt.ql === q ? 'selected' : ''}>${q}</option>`).join('')}</select><select id="fs">${[['added', L('Yeni eklenen', 'Newest added')], ['title', L('Ada göre', 'Title')], ['year', L('Yıla göre', 'Year')], ['rating', L('Puana göre', 'Rating')], ['views', L('Görüntülenme', 'Views')]].map(([k, l]) => `<option value="${k}" ${filt.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn btn-primary" id="add" type="button">${IC.plus}${isTv ? L('Dizi ekle', 'Add series') : L('Film ekle', 'Add movie')}</button></div><div class="tbl-wrap"><table><thead><tr><th></th><th>${L('Başlık', 'Title')}</th><th>${L('Kategori', 'Categories')}</th><th>${L('Puan', 'Rating')}</th><th>${L('Kalite', 'Quality')}</th><th>${L('Görüntülenme', 'Views')}</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => {
    let a = cat.filter(x => x.type === type); const q = filt.q.trim().toLowerCase();
    if (q) a = a.filter(x => (x.title + ' ' + (x.original || '')).toLowerCase().includes(q)); if (filt.g) a = a.filter(x => (x.genres || []).includes(+filt.g)); if (filt.ql) a = a.filter(x => x.quality === filt.ql);
    const by = { added: (x, y) => (y.added || 0) - (x.added || 0), title: (x, y) => x.title.localeCompare(y.title, S.lang), year: (x, y) => (y.year || 0) - (x.year || 0), rating: (x, y) => (y.rating || 0) - (x.rating || 0), views: (x, y) => (y.views || 0) - (x.views || 0) }; a.sort(by[filt.sort]);
    $('#tb').innerHTML = a.length ? a.map(x => `<tr><td><img class="th" src="${esc(poster(x))}" alt="" loading="lazy"></td><td class="cell-t"><b>${esc(x.title)} ${x.featured ? '★' : ''}</b><small>${esc(x.original || '')} · ${esc(x.year || '')}${isTv ? ' · ' + (x.seasons || []).length + L(' sezon', ' seasons') : x.runtime ? ' · ' + x.runtime + L(' dk', ' min') : ''}</small></td><td>${(x.genres || []).map(g => `<span class="tag">${esc(G[g] || g)}</span>`).join(' ')}</td><td>★ ${Number(x.rating || 0).toFixed(1)}</td><td><span class="tag">${esc(x.quality || '—')}</span></td><td>${(x.views || 0).toLocaleString()}</td><td><div class="row-a"><button class="mbtn" data-src="${x.id}" title="${L('Kaynaklar', 'Sources')}" aria-label="${L('Kaynaklar', 'Sources')}">${IC.play}</button>${isTv ? `<button class="mbtn" data-eps="${x.id}" title="${L('Bölümler', 'Episodes')}" aria-label="${L('Bölümler', 'Episodes')}">${IC.list}</button>` : ''}<button class="mbtn" data-edit="${x.id}" title="${L('Düzenle', 'Edit')}" aria-label="${L('Düzenle', 'Edit')}">${IC.edit}</button><button class="mbtn" data-del="${x.id}" title="${L('Sil', 'Delete')}" aria-label="${L('Sil', 'Delete')}">${IC.trash}</button></div></td></tr>`).join('') : `<tr><td colspan="7" class="empty">${L('Sonuç yok', 'No results')}</td></tr>`;
  };
  draw();
  $('#fq').oninput = debounce(e => { filt.q = e.target.value; draw(); }, 150); $('#fg').onchange = e => { filt.g = e.target.value; draw(); }; $('#fql').onchange = e => { filt.ql = e.target.value; draw(); }; $('#fs').onchange = e => { filt.sort = e.target.value; draw(); };
  $('#add').onclick = () => itemForm(type);
  $('#tb').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) itemForm(type, b.dataset.edit);
    else if (b.dataset.del) { const it = cat.find(x => x.id === b.dataset.del); if (confirm(L(`“${it.title}” silinsin mi?`, `Delete “${it.title}”?`))) { cat = cat.filter(x => x.id !== it.id); const m = LS.get(K.sources, {}); Object.keys(m).forEach(k => { if (k.includes(':' + it.id)) delete m[k]; }); LS.set(K.sources, m); if (commit(L('Silindi: ', 'Deleted: ') + it.title)) draw(); } }
    else if (b.dataset.src) { srcFilter = (isTv ? 'tv:' : 'movie:') + b.dataset.src; go('sources'); }
    else if (b.dataset.eps) { epSeries = b.dataset.eps; epSeason = 1; go('episodes'); }
  };
}
function imgField(name, label, val, kind) {
  return `<div class="f imgf" data-img="${name}" data-w="${kind === 'p' ? 500 : 1280}"><span>${label}</span><div class="pv ${kind}">${val ? `<img src="${esc(val)}" alt="">` : L('Önizleme', 'Preview')}</div><input type="hidden" name="${name}" value="${esc(val || '')}"><input type="url" placeholder="https://… ${L('(görsel adresi)', '(image URL)')}" data-url value="${val && /^https:/.test(val) ? esc(val) : ''}"><input type="file" accept="image/*" data-file></div>`;
}
function wireImgs(el) {
  $$('.imgf', el).forEach(f => {
    const pv = $('.pv', f), hid = $('input[type=hidden]', f), set = v => { hid.value = v; pv.innerHTML = v ? `<img src="${esc(v)}" alt="">` : L('Önizleme', 'Preview'); };
    $('[data-url]', f).onchange = e => { const v = e.target.value.trim(); if (!v || /^https:\/\//i.test(v)) set(v); else toast(L('Yalnızca https:// adresleri', 'Only https:// URLs')); };
    $('[data-file]', f).onchange = e => { const file = e.target.files[0]; if (!file) return; const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, +f.dataset.w / im.width), c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); set(c.toDataURL('image/jpeg', .8)); }; im.onerror = () => toast(L('Görsel okunamadı', 'Could not read image')); im.src = fr.result; }; fr.readAsDataURL(file); };
  });
}
function itemForm(type, id) {
  const isTv = type === 'tv', it = id ? cat.find(x => x.id === id) : { type, genres: [], quality: 'HD', rating: 7, year: new Date().getFullYear(), runtime: isTv ? 45 : 110, cast: [] }, G = gl();
  openModal(`<h2>${id ? L('Düzenle', 'Edit') : (isTv ? L('Dizi ekle', 'Add series') : L('Film ekle', 'Add movie'))}</h2><form class="form" id="itf"><div class="grid2"><label class="f"><span>${L('Başlık', 'Title')} *</span><input name="title" required value="${esc(it.title)}"></label><label class="f"><span>${L('Orijinal ad', 'Original title')}</span><input name="original" value="${esc(it.original)}"></label>
    <label class="f"><span>${L('Yıl', 'Year')}</span><input name="year" type="number" min="1900" max="2100" value="${esc(it.year)}"></label><label class="f"><span>${L('Puan (0-10)', 'Rating (0-10)')}</span><input name="rating" type="number" min="0" max="10" step="0.1" value="${esc(it.rating)}"></label>
    <label class="f"><span>${isTv ? L('Bölüm süresi (dk)', 'Episode runtime (min)') : L('Süre (dk)', 'Runtime (min)')}</span><input name="runtime" type="number" min="0" value="${esc(it.runtime)}"></label><label class="f"><span>${L('Kalite', 'Quality')}</span><select name="quality">${['SD', 'HD', '4K'].map(q => `<option ${it.quality === q ? 'selected' : ''}>${q}</option>`).join('')}</select></label>

}
function comments() {
  let c = LS.get(K.comments, null); if (!c) { const T = ['Harika bir film, sonunu beklemiyordum!', 'Görüntü yönetmenliği muhteşem.', 'İlk bölüm biraz yavaş ama sonra açılıyor.', 'Müzikler çok iyi seçilmiş.', 'Bu dizi daha fazla ilgiyi hak ediyor.']; c = T.map((x, i) => ({ id: 'c' + i, user: ['Aylin', 'Kaan', 'Selin', 'Mert', 'Defne'][i], text: x, on: (cat[i * 3] || cat[0] || {}).title || '—', ok: i % 2 === 0, ts: Date.now() - i * 36e5 * 5 })); LS.set(K.comments, c); }
  $v().innerHTML = `<p class="muted" style="margin-bottom:14px;font-size:.88rem">${L('Demo veri — site arayüzünde yorum özelliği yoktur; bu bölüm yalnızca yönetim arayüzünü gösterir.', 'Demo data — the site has no comment feature; this section only demonstrates the moderation UI.')}</p><div class="tbl-wrap"><table><thead><tr><th>${L('Kullanıcı', 'User')}</th><th>${L('Yorum', 'Comment')}</th><th>${L('İçerik', 'On')}</th><th>${L('Durum', 'Status')}</th><th></th></tr></thead><tbody>${c.map(x => `<tr><td><b>${esc(x.user)}</b><br><small class="muted">${ago(x.ts)}</small></td><td>${esc(x.text)}</td><td>${esc(x.on)}</td><td><span class="tag ${x.ok ? 'ok' : 'off'}">${x.ok ? L('Yayında', 'Published') : L('Bekliyor', 'Pending')}</span></td><td><div class="row-a"><button class="btn btn-glass btn-sm" data-ap="${x.id}">${x.ok ? L('Gizle', 'Hide') : L('Onayla', 'Approve')}</button><button class="mbtn" data-cd="${x.id}" aria-label="${L('Sil', 'Delete')}">${IC.trash}</button></div></td></tr>`).join('') || `<tr><td colspan="5" class="empty">—</td></tr>`}</tbody></table></div>`;
  $v().onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.ap) { const x = c.find(y => y.id === b.dataset.ap); x.ok = !x.ok; LS.set(K.comments, c); comments(); } else if (b.dataset.cd) { LS.set(K.comments, c.filter(y => y.id !== b.dataset.cd)); comments(); } };
}

/* ---------- settings + API ---------- */
function settings() {
  $v().innerHTML = `<div class="cols"><section class="panel"><h2>${L('Görünüm', 'Appearance')}</h2><div class="form"><div class="f"><span>${L('Dil', 'Language')}</span><div class="chips">${[['tr', 'Türkçe'], ['en', 'English']].map(([k, l]) => `<button class="chip ${S.lang === k ? 'on' : ''}" data-lang="${k}">${l}</button>`).join('')}</div></div><div class="f"><span>${L('Vurgu rengi', 'Accent colour')}</span><div class="swatches">${ACCENTS.map(c => `<button class="sw ${c === S.accent ? 'on' : ''}" data-ac="${c}" style="--c:${c}" aria-label="${c}"></button>`).join('')}</div></div></div></section>
  <section class="panel"><h2>${L('Veri', 'Data')}</h2><div class="form"><button class="btn btn-glass" id="exp" type="button">${L('Verileri dışa aktar (JSON)', 'Export data (JSON)')}</button><label class="btn btn-glass" style="cursor:pointer">${L('İçe aktar (JSON)', 'Import (JSON)')}<input type="file" id="imp" accept="application/json" hidden></label><button class="btn btn-ghost" id="reseed" type="button">${L('Demo kataloğu sıfırla', 'Reset demo catalogue')}</button><button class="btn btn-ghost" id="wipe" type="button" style="border-color:#ff6b7d;color:#ff8d9b">${L('Tüm yerel verileri sil', 'Delete all local data')}</button></div></section></div>`;
  $v().onclick = e => {
    const l = e.target.closest('[data-lang]'), a = e.target.closest('[data-ac]');
    if (l) { saveSettings({ lang: l.dataset.lang }); location.reload(); } else if (a) { saveSettings({ accent: a.dataset.ac }); settings(); }
    else if (e.target.id === 'exp') { const o = {}; Object.values(K).forEach(k => { const v = LS.get(k, undefined); if (v !== undefined) o[k] = v; }); const url = URL.createObjectURL(new Blob([JSON.stringify(o)], { type: 'application/json' })), el = document.createElement('a'); el.href = url; el.download = 'premium-cinema-data.json'; el.click(); URL.revokeObjectURL(url); }
    else if (e.target.id === 'reseed' && confirm(L('Katalog demo verilerle değiştirilsin mi? (Eklediğiniz içerikler silinir)', 'Replace the catalogue with demo data? (Your additions will be removed)'))) { cat = seedCatalog(); commit(L('Demo katalog sıfırlandı', 'Demo catalogue reset')); toast(L('Sıfırlandı', 'Reset')); }
    else if (e.target.id === 'wipe' && confirm(L('Tüm yerel veriler silinsin mi?', 'Delete all local data?'))) { Object.values(K).forEach(k => LS.del(k)); location.reload(); }
  };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { try { const o = JSON.parse(fr.result), valid = new Set(Object.values(K)); Object.entries(o).forEach(([k, v]) => { if (valid.has(k)) LS.set(k, v); }); toast(L('İçe aktarıldı', 'Imported')); setTimeout(() => location.reload(), 500); } catch (_) { toast(L('Geçersiz dosya', 'Invalid file')); } }; fr.readAsText(f); };
}
function api() {
  $v().innerHTML = `<section class="panel" style="max-width:720px"><h2>TMDB API v3</h2><form class="form" id="af"><div class="f"><span>${L('API anahtarı', 'API key')}</span><div class="f-row"><input name="k" type="password" autocomplete="off" spellcheck="false" value="${esc(S.apiKey)}" placeholder="YOUR_TMDB_API_KEY"><button class="btn btn-glass" type="button" id="tk">${L('Test et', 'Test')}</button></div><small id="km">${apiKey() ? L('Anahtar tanımlı. Site gerçek TMDB verisi kullanır.', 'Key set. The site uses real TMDB data.') : L('Anahtar yok: site demo veri gösterir (hiçbir istek yapılmaz).', 'No key: the site shows demo data (no requests are made).')}</small></div><div class="f"><small>${L('Anahtar bu tarayıcının LocalStorage’ında tutulur. Ön yüz projelerinde API anahtarı gizlenemez; TMDB’nin kullanım koşullarını göz önünde bulundurun. Anahtarı themoviedb.org → Ayarlar → API bölümünden alabilirsiniz.', 'The key is stored in this browser’s LocalStorage. A frontend-only project cannot hide an API key; respect TMDB’s terms of use. Get a key at themoviedb.org → Settings → API.')}</small></div><div class="f-actions"><span></span><button class="btn btn-primary" type="submit">${L('Kaydet', 'Save')}</button></div></form></section>`;
  $('#tk').onclick = async () => { const k = $('#af').k.value.trim(), m = $('#km'); if (!k) { m.textContent = L('Anahtar girin', 'Enter a key'); return; } m.className = ''; m.textContent = '…'; const ok = await Data.testKey(k); m.className = ok ? 'ok' : 'bad'; m.textContent = ok ? t('keyOk') : t('keyBad'); };
  $('#af').onsubmit = e => { e.preventDefault(); saveSettings({ apiKey: e.target.k.value.trim() }); logActivity(L('API anahtarı güncellendi', 'API key updated')); toast(L('Kaydedildi', 'Saved')); api(); };
}

/* ---------- boot ---------- */
shell();
document.addEventListener('click', e => { const b = e.target.closest('.adm-nav'); if (b) go(b.dataset.s); });
$('#menuBtn').onclick = () => document.body.classList.toggle('nav-open'); $('#scrim').onclick = () => document.body.classList.remove('nav-open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = $$('.modal').pop(); if (m && m._close) m._close(); } });
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
go(location.hash.slice(1) || 'overview');
</script>
</body>
</html>
